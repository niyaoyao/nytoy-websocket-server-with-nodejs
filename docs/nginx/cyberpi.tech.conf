# ======================
# HTTP (80) → 自动跳转 HTTPS
# ======================
server {
    listen 80;
    server_name cyberpi.tech www.cyberpi.tech;

    # 强制 HTTPS
    return 301 https://$host$request_uri;
}


# ======================
# HTTPS (443)
# ======================
server {
    listen 443 ssl http2;
    server_name cyberpi.tech www.cyberpi.tech;

    # 证书配置（Certbot 自动维护）
    ssl_certificate /etc/letsencrypt/live/cyberpi.tech/fullchain.pem;
    ssl_certificate_key  /etc/letsencrypt/live/cyberpi.tech/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    # ======================
    # 静态网站根目录
    # ======================
    root /usr/share/nginx/html;
    index index.html index.htm;


    # ======================
    # 静态页面
    # ======================
    location / {
        try_files $uri $uri/ =404;
    }

    location /quickdraw/ {
        try_files $uri $uri/ /quickdraw/index.html;
    }

    location /chatbot/ {
        try_files $uri $uri/ /chatbot/index.html;
    }


    # ======================
    # WebSocket 反向代理（最关键部分）
    # ======================
    location /ws/ {
        proxy_pass http://127.0.0.1:23333;     # Node WebSocket 服务端口

        # --- 必需设置：WebSocket 升级 ---
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # --- 保持长连接、防止超时断开 ---
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;

        # --- 传递真实客户端 IP ---
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        # 避免代理缓存 WebSocket 数据
        proxy_buffering off;
    }
}
