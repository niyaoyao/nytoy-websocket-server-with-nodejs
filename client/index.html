<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=0">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <title>摸鱼聊天室</title>
  <link rel="stylesheet" href="./chat.css">
</head>
<body>
  <main class="app">
    <header class="app__header">
      <div>
        <h1>摸鱼聊天室</h1>
        <p>连接到 Node.js WebSocket 服务器，实时同步消息。</p>
      </div>
      <div class="status" id="status">connecting…</div>
    </header>

    <section class="panel">
      <ul class="messages" id="messageList" aria-live="polite"></ul>
    </section>

    <section class="panel panel--composer">
      <form id="chatForm" autocomplete="off">
        <label class="field">
          <span>昵称</span>
          <input id="nickname" type="text" placeholder="取一个昵称" required maxlength="24">
        </label>
        <label class="field field--grow">
          <span>内容</span>
          <input id="message" type="text" placeholder="说点什么…（支持图片）" required>
        </label>
        <div class="composer__actions">
          <button type="button" id="imageButton" class="ghost-btn" title="选择图片或粘贴图片发送">发送图片</button>
          <button type="submit" class="send-btn">发送</button>
        </div>
        <input id="imagePicker" type="file" accept="image/*" hidden>
      </form>
    </section>
  </main>

  <template id="messageTemplate">
    <li class="message">
      <div class="message__meta">
        <span class="message__nickname"></span>
        <time class="message__time"></time>
      </div>
      <div class="message__content"></div>
    </li>
  </template>

  <script src="./chat.js" defer></script>
</body>
</html>
